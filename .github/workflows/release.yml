name: Release

# Pushing a vX.Y.Z tag publishes a GitHub release whose notes are that version's CHANGELOG.md entry, then uploads
# the package to PyPI through trusted publishing and pushes the AUR package. The tag must be on main, where CI has
# already checked the commit. The AUR job needs AUR_SSH_PRIVATE_KEY in the `aur` environment: the private half of a
# key on the maintainer's AUR account. Limit that environment to `v*.*.*` tags so no other ref can read it.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches both versions
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$plugin" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $version and plugin.json $plugin must match"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/changelog.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          # A rerun finds the release already there and leaves it.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  pypi:
    name: PyPI
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/deskpilot/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.18"
          enable-cache: false

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always

  aur:
    name: AUR
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One push at a time: a second tag's push would be refused as behind the first.
    concurrency:
      group: aur-push
      cancel-in-progress: false
    environment:
      name: aur
      url: https://aur.archlinux.org/packages/deskpilot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the package
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/source.tar.gz" "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          python3 scripts/render_aur.py --version "${GITHUB_REF_NAME#v}" --sha256 "$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)" --out "$RUNNER_TEMP/aur"

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/deskpilot.git "$RUNNER_TEMP/aur-repo"
          cd "$RUNNER_TEMP/aur-repo"
          # A rerun of an older tag must not put its version back over a newer one.
          version="${GITHUB_REF_NAME#v}"
          published=$(sed -n 's/^pkgver=//p' PKGBUILD 2>/dev/null || true)
          if [ -n "$published" ] && [ "$published" != "$version" ] && [ "$(printf '%s\n' "$published" "$version" | sort -V | tail -n 1)" = "$published" ]; then
            echo "The AUR already has $published, newer than $version; leaving it."
            exit 0
          fi
          cp "$RUNNER_TEMP/aur/PKGBUILD" "$RUNNER_TEMP/aur/.SRCINFO" .
          git config user.name "cjber"
          git config user.email "cjber@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          # A rerun finds the version already pushed and leaves it.
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deskpilot $version"
          git push origin HEAD:master
